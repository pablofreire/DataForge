name: Performance (k6)

# Load tests are run on demand only, never on every pull request.
on:
  workflow_dispatch:
    inputs:
      vus:
        description: Virtual users (10, 50, 100, 250, 500)
        default: "10"
      duration:
        description: Duration (k6 format)
        default: "1m"

permissions:
  contents: read

jobs:
  k6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        env:
          LOGIN_PERMITS_PER_MINUTE: "1000"
        run: docker compose -f deploy/compose/docker-compose.yml up --build -d
      - name: Wait for readiness
        run: for _ in $(seq 1 60); do curl -fs http://localhost:8080/health/ready && break; sleep 2; done
      - name: Run k6 baseline
        run: |
          mkdir -p tests/k6/results
          docker run --rm --network host -e BASE_URL=http://localhost:8080 \
            -e VUS=${{ inputs.vus }} -e DURATION=${{ inputs.duration }} \
            -v "$PWD/tests/k6:/scripts" grafana/k6 run \
            --summary-export /scripts/results/baseline-${{ inputs.vus }}vus.json /scripts/scenarios/baseline.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-results
          path: tests/k6/results
