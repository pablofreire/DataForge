name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build, unit, architecture and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore DataForge.slnx
      - name: Build (warnings as errors)
        run: dotnet build DataForge.slnx -c Release --no-restore
      - name: Unit and architecture tests
        run: |
          for project in tests/BuildingBlocks/*UnitTests tests/Modules/*/*UnitTests tests/DataForge.ArchitectureTests; do
            dotnet test --project "$project" -c Release --no-build --report-xunit-trx --results-directory TestResults
          done
      - name: Integration tests (Testcontainers PostgreSQL)
        run: dotnet test --project tests/DataForge.IntegrationTests -c Release --no-build --report-xunit-trx --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  e2e:
    name: Playwright end-to-end tests
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Start the stack
        run: docker compose -f deploy/compose/docker-compose.yml up --build -d --wait --wait-timeout 300 web
      - name: Wait for readiness
        run: |
          for i in $(seq 1 60); do curl -fs http://localhost:8080/health/ready && exit 0; sleep 2; done
          docker compose -f deploy/compose/docker-compose.yml logs
          exit 1
      - name: Build E2E tests and install Chromium
        run: |
          dotnet build tests/DataForge.E2ETests -c Release
          pwsh tests/DataForge.E2ETests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - name: Run Playwright
        env:
          DATAFORGE_BASE_URL: http://localhost:8080
          DATAFORGE_EVIDENCE_DIR: ${{ github.workspace }}/e2e-evidence
        run: dotnet test --project tests/DataForge.E2ETests -c Release --no-build
      - name: Upload screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence
          path: e2e-evidence
      - name: Container logs on failure
        if: failure()
        run: docker compose -f deploy/compose/docker-compose.yml logs

  secrets-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        host: [DataForge.Web, DataForge.Worker, DataForge.Migrator]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          build-args: HOST=${{ matrix.host }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
