version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    groups:
      opentelemetry:
        patterns: ["OpenTelemetry*"]
      microsoft:
        patterns: ["Microsoft.*"]
      testing:
        patterns: ["xunit*", "Testcontainers*", "NSubstitute", "AwesomeAssertions", "Microsoft.Playwright*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: "/deploy/docker"
    schedule:
      interval: weekly
